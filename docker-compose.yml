# ============================================
# 仓库管理系统 Docker部署配置 (CPU版本)
# ============================================
# 使用方法:
#   构建: docker compose -f docker-compose.cpu.yml build
#   启动: docker compose -f docker-compose.cpu.yml up -d
#   停止: docker compose -f docker-compose.cpu.yml down
# ============================================

services:
  # 后端服务 - CPU版本
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: barcodesys-backend-cpu
    ports:
      - "3004:3003"
    volumes:
      - ./server/database:/app/database
      - ./server/backups:/app/backups
      - ./server/uploads:/app/uploads
      - ./data:/app/data
      - ./server/scripts:/app/scripts:ro
      - ./server/jobs:/app/jobs:ro
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DB_PATH=/app/database/inventory.db
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - TZ=Asia/Shanghai
      - SNAPSHOT_ENABLED=true
      - SNAPSHOT_SCHEDULE=0 2 1 * *
      - OCR_WORKERS=2
    networks:
      - barcodesys-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/products?limit=1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 前端服务
  frontend:
    build: ./client
    container_name: barcodesys-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=/api
    networks:
      - barcodesys-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  barcodesys-network:
    driver: bridge
